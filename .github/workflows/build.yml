name: Build Nexora Gamepad

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "windows/**"
      - "protocol/**"
      - ".github/workflows/build.yml"

concurrency:
  group: nexora-gamepad-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: |
          cd android
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-Gamepad-Android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt
          pip install pyinstaller
      - name: Test Windows receiver
        run: python -m unittest discover -s windows -p "test_*.py"
      - name: Build executable
        run: pyinstaller --onefile --name NexoraGamepad windows/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-Gamepad-Windows
          path: dist/NexoraGamepad.exe
          if-no-files-found: error
