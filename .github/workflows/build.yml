name: Build Nexora Gamepad

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "windows/**"
      - "protocol/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          if [ -f android/gradlew ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f android/build.gradle.kts ] || [ -f android/build.gradle ]; then
            cd android
            gradle assembleDebug
          else
            echo "Android project files are not ready yet."
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Gamepad-Android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path windows/requirements.txt) {
            pip install -r windows/requirements.txt
          }
          pip install pyinstaller
        shell: pwsh
      - name: Build executable
        run: |
          if (Test-Path windows/main.py) {
            pyinstaller --onefile --name NexoraGamepad windows/main.py
          } else {
            Write-Error "Windows receiver source is not ready yet."
          }
        shell: pwsh
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Gamepad-Windows
          path: dist/NexoraGamepad.exe
          if-no-files-found: error
